<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Chat</title>
  <link rel="stylesheet" href="style.css" />

  <!-- These lines let people add the chat to their home screen like an app -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a84ff" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chat" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <!-- Shown for a moment while we check if you're logged in -->
  <div id="loading-screen" class="center-screen">
    <div class="spinner"></div>
  </div>

  <!-- ===================== Log in / Sign up ===================== -->
  <div id="auth-screen" class="center-screen hidden">
    <form id="auth-form" class="card auth-card" novalidate>
      <h1>💬 Simple Chat</h1>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="login">Log in</button>
        <button type="button" class="tab" data-mode="signup">Sign up</button>
      </div>

      <label class="field signup-only hidden">
        <span>Username</span>
        <input id="auth-username" type="text" placeholder="e.g. alex_22" maxlength="20" autocomplete="username" autocapitalize="off" />
        <small class="hint">3–20 letters, numbers, _ or .  This is what friends search for.</small>
      </label>
      <label class="field">
        <span>Email</span>
        <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="auth-password" type="password" placeholder="At least 6 characters" autocomplete="current-password" />
      </label>

      <div id="auth-error" class="error hidden"></div>
      <button id="auth-submit" type="submit" class="primary">Log in</button>
    </form>
  </div>

  <!-- ===================== The app ===================== -->
  <div id="app" class="app hidden">

    <!-- Left side: list of chats -->
    <aside class="list-pane">
      <header class="pane-header">
        <button id="account-button" class="avatar-button" type="button" title="Account"></button>
        <h2>Chats</h2>
        <button id="new-chat-button" class="icon-button" type="button" title="New chat">✏️</button>

        <div id="account-menu" class="dropdown account-menu hidden">
          <div class="dropdown-title">Logged in as</div>
          <div id="account-name" class="account-name"></div>
          <button id="logout-button" type="button" class="danger-link">Log out</button>
        </div>
      </header>

      <ul id="chat-list" class="chat-list"></ul>
      <div id="chat-list-empty" class="empty-state hidden">
        <div class="empty-emoji">👋</div>
        <p>No chats yet.</p>
        <button id="empty-new-chat" type="button" class="primary small">Start a chat</button>
      </div>
    </aside>

    <!-- Right side: the open chat -->
    <section class="chat-pane">
      <div id="no-chat" class="empty-state">
        <div class="empty-emoji">💬</div>
        <p>Pick a chat, or start a new one.</p>
      </div>

      <div id="chat-view" class="chat-view hidden">
        <header class="chat-header">
          <button id="back-button" class="icon-button back-button" type="button" aria-label="Back">‹</button>
          <button id="chat-title-button" class="chat-title-button" type="button">
            <span id="chat-avatar"></span>
            <span class="chat-title-text">
              <span id="chat-title" class="chat-title"></span>
              <span id="chat-subtitle" class="chat-subtitle"></span>
            </span>
          </button>
          <button id="sound-button" class="icon-button" type="button" title="Sound on/off">🔔</button>

          <!-- Dropdown: who's in this chat -->
          <div id="members-panel" class="dropdown members-panel hidden">
            <div class="dropdown-title">Members</div>
            <ul id="members-list"></ul>
            <div id="group-actions" class="group-actions hidden">
              <button id="add-members-button" type="button">＋ Add people</button>
              <button id="leave-group-button" type="button" class="danger-link">Leave group</button>
            </div>
          </div>
        </header>

        <main id="messages" class="messages"></main>

        <div id="typing" class="typing"></div>

        <!-- Shows "Replying to ..." above the message box -->
        <div id="reply-bar" class="reply-bar hidden">
          <div class="reply-bar-text">
            <div class="reply-bar-name" id="reply-bar-name"></div>
            <div class="reply-bar-preview" id="reply-bar-preview"></div>
          </div>
          <button id="reply-cancel" class="icon-button" type="button" aria-label="Cancel reply">✕</button>
        </div>

        <!-- Shows the chosen photo before you send it -->
        <div id="photo-bar" class="photo-bar hidden">
          <img id="photo-preview" alt="Photo to send" />
          <div class="photo-bar-text">Add a caption, or just press send</div>
          <button id="photo-cancel" class="icon-button" type="button" aria-label="Remove photo">✕</button>
        </div>

        <form id="message-form" class="composer">
          <label class="photo-button" title="Send a photo">
            📷
            <input id="photo-input" type="file" accept="image/*" hidden />
          </label>
          <input id="message-input" type="text" placeholder="Message" maxlength="2000" autocomplete="off" />
          <button type="submit" class="send-button" aria-label="Send">➤</button>
        </form>
      </div>
    </section>
  </div>

  <!-- ===================== New chat / new group window ===================== -->
  <div id="new-chat-modal" class="modal-backdrop hidden">
    <div class="modal card">
      <header class="modal-header">
        <button id="modal-cancel" type="button" class="text-button">Cancel</button>
        <h3 id="modal-title">New chat</h3>
        <button id="modal-create" type="button" class="text-button bold" disabled>Create</button>
      </header>

      <div id="modal-tabs" class="tabs">
        <button type="button" class="tab active" data-mode="dm">Private chat</button>
        <button type="button" class="tab" data-mode="group">New group</button>
      </div>

      <input id="group-name" class="hidden" type="text" placeholder="Group name" maxlength="40" />
      <div id="picked-people" class="picked-people hidden"></div>
      <input id="user-search" type="search" placeholder="Search people…" autocomplete="off" autocapitalize="off" />
      <ul id="user-results" class="user-results"></ul>
      <div id="modal-error" class="error hidden"></div>
    </div>
  </div>

  <!-- Pop-up menu that appears when you tap a message -->
  <div id="message-menu" class="message-menu hidden">
    <div id="menu-emojis" class="menu-emojis"></div>
    <button id="menu-reply" class="menu-reply" type="button">↩ Reply</button>
  </div>

  <!-- Full-screen photo viewer (tap a photo in the chat to open it) -->
  <div id="viewer" class="viewer hidden">
    <img id="viewer-image" alt="" />
  </div>

  <!-- Small pop-up messages like "Couldn't send" -->
  <div id="toast" class="toast hidden"></div>

  <!-- Supabase library, then our settings, then the app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="script.js"></script>
</body>
</html>
